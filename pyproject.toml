[project]
name = "lectucli"
version = "0.1.0"
description = "Gestiona y organiza lecturas para actividades de aula desde la terminal"
readme = "README.md"
authors = [
    { name = "GraciaTF", email = "235654310+GraciaTF@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "odfpy>=1.4.1",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
lectucli = "lectucli.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
